spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

# Postgresql config
spring.datasource.url=jdbc:postgresql://localhost:5432/pretriage_db?options=-c%20timezone=America/Argentina/Buenos_Aires
spring.datasource.username=myuser
spring.datasource.password=how5are#you2
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# validos: (validate, update, create, create-drop, none)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
