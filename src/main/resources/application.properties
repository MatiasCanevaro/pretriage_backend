spring.application.name=backend

# Postgresql config
spring.datasource.url=jdbc:postgresql://localhost:5432/pretriage_db?options=-c%20timezone=America/Argentina/Buenos_Aires
spring.datasource.username=myuser
spring.datasource.password=how5are#you2
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# validos: (validate, update, create, create-drop, none)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# registro el link al servidor auth0 para oauth
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://dev-bktuk8spi6fy0cal.us.auth0.com/

# habilito docker para tests de integración
spring.docker.compose.skip.in-tests=false

#auth0 params

auth0.client-id.machine-to-machine=${AUTH0_M2M_CLIENT_ID}
auth0.client-secret.machine-to-machine=${AUTH0_M2M_CLIENT_SECRET}
auth0.scope.machine-to-machine=${AUTH0_M2M_SCOPE}
auth0.base-path=https://dev-bktuk8spi6fy0cal.us.auth0.com
auth0.client-id.app=${AUTH0_APP_CLIENT_ID}

#google api params

google.api.key=${GOOGLE_MAPS_API_KEY}
google.places.base-url=https://places.googleapis.com/v1/places

# tiempo estimado de atención triage médico
# 15 minutos
tiempo.estimado.atencion-triage.segundos=900

#inyecto archivo con variables de entorno para desarrollo
spring.config.import=optional:file:.env[.properties]

# Spring AI Ollama
spring.ai.ollama.chat.model=llama3.2:3b
spring.ai.ollama.chat.temperature=0
spring.ai.ollama.chat.seed=42
spring.ai.retry.max-attempts=1

# Bound external AI calls so reception can use its deterministic fallback when
# Ollama is stopped or does not answer.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=45s

# Estimacion de atencion
pretriage.estimacion.minutos-promedio-atencion=10

#Nombre del Bucket AWS S3
aws.s3.bucket-name=pretriage-bucket

# S3 es opcional para desarrollo local. Al activarlo se requieren las tres
# variables AWS declaradas debajo.
pretriage.storage.s3.enabled=${PRETRIAGE_STORAGE_S3_ENABLED:false}

aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY}
aws.s3.region=${AWS_S3_REGION}
