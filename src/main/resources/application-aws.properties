# Explicit AWS deployment profile. This file is self-contained so the packaged
# application does not depend on the ignored local application.properties or .env.
spring.application.name=pretriage-backend

# The AWS database is supplied by the runtime (for example, an RDS endpoint).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Demo profile only: preserve data across restarts; replace with validate when a
# versioned schema migration workflow is introduced.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Never discover or start a developer's compose services or DevTools restarts.
spring.docker.compose.enabled=false
spring.docker.compose.skip.in-tests=true
spring.devtools.restart.enabled=false
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Auth0 values are supplied by the deployment environment.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI}
auth0.base-path=${AUTH0_BASE_PATH:}
auth0.client-id.machine-to-machine=${AUTH0_M2M_CLIENT_ID:}
auth0.client-secret.machine-to-machine=${AUTH0_M2M_CLIENT_SECRET:}
auth0.scope.machine-to-machine=${AUTH0_M2M_SCOPE:}
auth0.client-id.app=${AUTH0_APP_CLIENT_ID:}

# Maps and Gemini configuration. Feature keys may be left empty if a feature is
# not enabled in the deployment.
google.api.key=${GOOGLE_MAPS_API_KEY:}
google.places.base-url=${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1/places}
google.routes.base-url=${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com/directions/v2:computeRoutes}
pretriage.ia.gemini.api-key=${GEMINI_API_KEY:}
pretriage.ia.gemini.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
pretriage.ia.gemini.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
pretriage.ia.gemini.connect-timeout=5s
pretriage.ia.gemini.request-timeout=${GEMINI_REQUEST_TIMEOUT:45s}
pretriage.ia.gemini.max-output-tokens=${GEMINI_MAX_OUTPUT_TOKENS:8192}
pretriage.ia.gemini.max-attempts=${GEMINI_MAX_ATTEMPTS:2}
pretriage.ia.gemini.attempt-timeout=${GEMINI_ATTEMPT_TIMEOUT:20s}
pretriage.ia.gemini.retry-initial-backoff=${GEMINI_RETRY_INITIAL_BACKOFF:500ms}
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=45s
pretriage.voz.gemini.api-key=${GEMINI_API_KEY:}
pretriage.voz.gemini.modelo=${GEMINI_LIVE_MODEL:models/gemini-3.8-live}
pretriage.voz.gemini.url=${GEMINI_LIVE_URL:wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent}
pretriage.voz.gemini.voz=${GEMINI_LIVE_VOICE:Kore}
pretriage.voz.gemini.idioma=${GEMINI_LIVE_LANGUAGE:es-US}
pretriage.voz.gemini.connect-timeout=10s
# Use the exact HTTPS origin(s) of the deployed frontend; no wildcard default.
pretriage.voz.origenes-permitidos=${PRETRIAGE_VOZ_ORIGENES}
pretriage.cors.allowed-origins=${PRETRIAGE_CORS_ALLOWED_ORIGINS:}

# Email can remain in local handoff mode until SMTP is configured.
pretriage.invitations.email.mode=${PRETRIAGE_INVITATIONS_EMAIL_MODE:local}
pretriage.invitations.email.from=${PRETRIAGE_INVITATIONS_EMAIL_FROM:no-reply@pretriage.local}
pretriage.frontend.base-url=${PRETRIAGE_FRONTEND_BASE_URL:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
pretriage.cambio-contrasenia.email.mode=${PRETRIAGE_CAMBIO_EMAIL_MODE:${PRETRIAGE_INVITATIONS_EMAIL_MODE:local}}
pretriage.cambio-contrasenia.email.from=${PRETRIAGE_CAMBIO_EMAIL_FROM:${PRETRIAGE_INVITATIONS_EMAIL_FROM:no-reply@pretriage.local}}

# Existing service settings with conservative defaults.
pretriage.estimacion.minutos-promedio-atencion=${PRETRIAGE_ESTIMACION_MINUTOS_PROMEDIO_ATENCION:10}
pretriage.cambio-contrasenia.expiracion-minutos=${PRETRIAGE_CAMBIO_CONTRASENIA_EXPIRACION:15}
pretriage.cambio-contrasenia.max-solicitudes-por-hora=${PRETRIAGE_CAMBIO_MAX_POR_HORA:3}
pretriage.cambio-contrasenia.ventana-horas=${PRETRIAGE_CAMBIO_VENTANA_HORAS:1}
pretriage.cambio-contrasenia-autenticado.max-intentos=${PRETRIAGE_CAMBIO_AUTENTICADO_MAX_INTENTOS:3}
pretriage.cambio-contrasenia-autenticado.horas-bloqueo=${PRETRIAGE_CAMBIO_AUTENTICADO_HORAS_BLOQUEO:24}

# S3 supports the SDK's default credential chain (EC2/ECS role) when no static
# key pair is supplied. Grant the role only the object actions the service uses.
pretriage.storage.s3.enabled=${PRETRIAGE_STORAGE_S3_ENABLED:true}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.region=${AWS_S3_REGION:${AWS_REGION:}}
# Leave legacy static-key properties blank here. The SDK provider chain reads
# standard AWS_* variables itself, including session tokens for temporary creds.
aws.accessKeyId=
aws.secretAccessKey=

# Expose only the low-detail health endpoint for load balancer probes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.health.mail.enabled=false

# deshabilitar swagger en producción
springdoc.swagger-ui.enabled=false